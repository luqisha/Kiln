[project]
name = "kiln"
version = "0.1.0"
description = "Self-hosted software factory: GitHub issue -> sandboxed AI agent -> verified pull request."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "time-machine>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F",    # pycodestyle, pyflakes
  "I",              # isort
  "N",              # pep8-naming
  "C90",            # mccabe complexity
  "FBT",            # no boolean flag arguments
  "B",              # bugbear
  "UP",             # pyupgrade
  "S",              # bandit (security)
  "ASYNC",          # async pitfalls
  "DTZ",            # naive datetimes
  "PTH",            # pathlib over os.path
  "RET", "SIM",     # simpler control flow
  "T20",            # no print()
  "ERA",            # no commented-out code
  "PL",             # pylint subset
  "TID",            # banned APIs
  "RUF",
]
ignore = ["PLR0913"]  # many-args is normal for node/adapter signatures

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 40
max-returns = 5
max-nested-blocks = 3

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read settings via app.config.Settings only."
"os.getenv".msg = "Read settings via app.config.Settings only."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "FBT"]  # assert, fake secrets, magic numbers, bool params
"alembic/versions/**" = ["N", "ERA"]      # generated migration names and comments

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = [
  "docker: needs a Docker daemon (integration)",
  "db: needs Postgres via testcontainers",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
layers = [
  "(app.main) | (app.worker)",
  "(app.orchestrator)",
  "(app.sandbox) | (app.github) | (app.llm) | (app.agents)",
  "(app.auth)",
  "(app.database)",
  "(app.schemas) | (app.models)",
  "(app.config) | app.log",
  "app.errors | app.constants",
]
